name: Build & Push Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - agent/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Espacio disponible (antes de limpiar)
        run: df -h /

      - name: Liberar espacio en el runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Espacio disponible (despues de limpiar)
        run: df -h /

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sauzal-node:latest

      - name: Espacio disponible (despues del build)
        if: always()
        run: df -h /
